{% extends "base.html" %}
{% from "macros.html" import sidebar, topbar, flash_messages %}

{% block body %}
{{ sidebar() }}
{{ topbar() }}

<div class="content">
  <h2>Edit Extracurricular Activity</h2>

  {{ flash_messages() }}

  <form method="POST">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{ activity.title }}" required>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4">{{ activity.description }}</textarea>
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" value="{{ activity.date }}">
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('trainee_extracurricular') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
