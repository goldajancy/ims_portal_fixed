<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}IMS Portal{% endblock %}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
<link rel="stylesheet" href="{{ url_for('static', filename='css/chatbot.css') }}"/>
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}

{% if session.get('user_id') %}
<!-- Floating AI Chatbot Widget -->
<button id="ims-chat-launcher" aria-label="Open IMS AI Assistant" title="Chat with IMS AI Assistant">
  <i class="fas fa-robot"></i>
  <span class="badge-pulse"></span>
</button>

<div id="ims-chat-widget" data-role="{{ session.get('role', 'trainee') }}" data-name="{{ session.get('name', 'User') }}">
  <div class="ims-chat-header">
    <div class="ims-chat-header-info">
      <div class="ims-chat-avatar">
        <i class="fas fa-brain"></i>
      </div>
      <div>
        <h4 class="ims-chat-title">
          IMS AI Assistant
          <span class="ims-chat-badge">{{ session.get('role', 'trainee') }}</span>
        </h4>
        <div class="ims-chat-status">
          <span class="ims-chat-status-dot"></span> Online &bull; Gemini
        </div>
      </div>
    </div>
    <div class="ims-chat-actions">
      <button class="ims-chat-btn-icon" id="ims-chat-clear-btn" title="Clear Chat History">
        <i class="fas fa-trash-alt"></i>
      </button>
      <button class="ims-chat-btn-icon" id="ims-chat-close-btn" title="Minimize Chat">
        <i class="fas fa-times"></i>
      </button>
    </div>
  </div>

  <div class="ims-chat-messages" id="ims-chat-messages">
    <!-- Messages loaded dynamically -->
  </div>

  <div class="ims-chat-suggestions" id="ims-chat-suggestions">
    <!-- Quick prompt chips -->
  </div>

  <div class="ims-chat-footer">
    <div class="ims-chat-input-box">
      <input type="text" id="ims-chat-input" class="ims-chat-input" placeholder="Ask IMS AI anything..." autocomplete="off" />
      <button id="ims-chat-send-btn" class="ims-chat-send-btn" title="Send Message">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/chatbot.js') }}"></script>
{% endif %}

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
