  h2 { color: #16a34a; margin-bottom: 8px; }

</style>

<body>
  <div class="box">
    <div class="icon">✅</div>
    <h2>Attendance Submitted!</h2>
    <p>{{ cls.name }} — {{ date }}</p>

  </div>
</body>
</html>
